services:
  - type: web
    # Legacy Blueprint service kept temporarily as a rollback for the original URL.
    # The primary service is the manually created https://mythreatlens.onrender.com.
    name: mythreatlens-old
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        value: sqlite:////tmp/my_threatlens.db
      - key: SECURE_COOKIES
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://my-threatlens-demo.onrender.com
      - key: SHARED_USERNAME
        value: cyber expert
      - key: SHARED_PASSWORD
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_FROM_EMAIL
        sync: false
      - key: LIVE_COLLECTORS_ENABLED
        value: "true"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_RESULTS_PER_SOURCE
        value: "60"
      - key: RESULTS_PAGE_SIZE
        value: "25"
      - key: OLLAMA_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gpt-oss:20b
      - key: OLLAMA_API_KEY
        sync: false
